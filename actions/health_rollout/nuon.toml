# action
# One of four health checks the full-health-check runbook composes. Each writes
# k=v to $NUON_ACTIONS_OUTPUT_FILEPATH; the install readme renders them as a
# per-check status chart. Diagnostics go to stdout, never to the output file.
name    = "health_rollout"
timeout = "6m"

[[triggers]]
type = "manual"

[[triggers]]
type = "post-provision"

[[steps]]
name            = "check-rollout"
inline_contents = "./health_rollout/script.sh"

[labels]
kind = "health-check"
team = "platform"
