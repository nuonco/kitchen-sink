# action
# The delivery-success heartbeat: hourly snapshot of the relay namespace with
# pods_ready/pods_total structured outputs (read by the install README).
name    = "cron_status"
timeout = "1m"

[[triggers]]
type          = "cron"
cron_schedule = "0 * * * *"

[[triggers]]
type = "manual"

[[steps]]
name            = "collect-status"
inline_contents = "./cron_status/script.sh"

[labels]
is_health_check = "true"
