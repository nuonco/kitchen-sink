# action
# Reads the seeded demo object from the app's S3 bucket. The bucket policy in
# components/pulumi denies s3:GetObject to every other principal — the account
# admin included — so this pull works only while the customer has the
# break-glass role enabled in their install stack; disabled, the role can't be
# assumed and the run fails.
name             = "break_glass_s3_pull"
timeout          = "2m"
dependencies     = ["pulumi_infra"]
break_glass_role = "{{.nuon.install.id}}-app-break-glass"

[[triggers]]
type = "manual"

[[steps]]
name            = "pull-object"
inline_contents = "./break_glass_s3_pull/script.sh"

# Bucket and key mirror components/pulumi/main.go rather than reading the
# component's outputs: demo_object_key only exists once pulumi_infra redeploys
# with this change, and a bare output reference fails install render until then.
[steps.env_vars]
BUCKET = "kitchen-sink-{{.nuon.install.id}}"
KEY    = "break-glass/demo.txt"

[labels]
is_break_glass = "true"
