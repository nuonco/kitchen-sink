name               = "container_component_image"
image              = "{{.nuon.components.action_curl.outputs.image.ref}}"
timeout            = "30s"
enable_kube_config = false
dependencies       = ["action_curl", "application_load_balancer"]

[[triggers]]
type = "manual"

[[steps]]
name = "check-kitchen-sink"
inline_contents = """
#!/usr/bin/env sh
set -e

echo "running with $(curl --version | head -1)"
status=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "${ENDPOINT}/livez")
nuon_output status "$status"
nuon_output image "$IMAGE"

if [ "$status" != "200" ]; then
  echo "health check failed: expected 200, got ${status}" >&2
  exit 1
fi

echo "health check passed"
"""

[steps.env_vars]
ENDPOINT = "https://app.{{.nuon.install.sandbox.outputs.nuon_dns.public_domain.name}}"
IMAGE    = "{{.nuon.components.action_curl.outputs.image.ref}}"

[labels]
runtime = "container"
sample  = "component-image"
