# action
# Emergency pause of every sync pipeline, run through a recorded action instead
# of ad-hoc console access. `break_glass_role` names the role declared in
# ../break_glass.toml (AdministratorAccess with a secretsmanager:* Deny
# boundary), so every run is attributable in the install's workflow history.
name               = "pause_pipelines"
timeout            = "10m"
enable_kube_config = true
break_glass_role   = "{{.nuon.install.id}}-app-break-glass"

[[triggers]]
type = "manual"

[[steps]]
name            = "pause-verify-resume"
inline_contents = "./pause_pipelines/script.sh"

[labels]
is_break_glass = "true"
