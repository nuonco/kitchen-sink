# action
# Elevated remediation, run through a recorded action instead of ad-hoc console
# access. `break_glass_role` names the role declared in ../break_glass.toml
# (AdministratorAccess with a secretsmanager:* Deny boundary), so every run is
# attributable in the install's workflow history.
name               = "break_glass_remediation"
timeout            = "10m"
enable_kube_config = true
break_glass_role   = "{{.nuon.install.id}}-app-break-glass"

[[triggers]]
type = "manual"

[[steps]]
name            = "elevated-remediation"
inline_contents = "./break_glass_remediation/script.sh"

[labels]
is_break_glass = "true"
