# action
# Creates cluster-admin EKS access entries for ROLES. Runs as the
# access-entries break-glass role.
#
# The role-enabled trigger is fired by the install stack's phone-home webhook
# (POST /v1/stacks/{install_id}/phone-home) after the customer applies the
# stack with the role enabled. It fires for any role; the script only acts when
# ROLE_NAME is the access-entries break-glass role. Retool's production setup
# does not use this; they run the runbook manually.
name    = "install_access_entries"
image   = "alpine/k8s:1.34.1"
timeout = "2m"
role    = "{{.nuon.install.id}}-access-entries-break-glass"

[[triggers]]
type = "role-enabled"

[[triggers]]
type = "manual"

[[steps]]
name            = "install_access_entries"
inline_contents = "./install_access_entries/script.sh"

[steps.env_vars]
ACCOUNT_ID   = "{{.nuon.install_stack.outputs.account_id}}"
CLUSTER_NAME = "{{.nuon.install.sandbox.outputs.cluster.name}}"
ROLES        = "{{.nuon.install.id}}-provision,{{.nuon.install.id}}-deprovision,{{.nuon.install.id}}-app-break-glass"

[labels]
is_break_glass = "true"
