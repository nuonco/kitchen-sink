# action
# Custom-image DNS check: compare sandbox nameservers to what a public resolver
# returns, and gate the certificate component until they match. ACM validates
# *.<install domain> over DNS, so a mismatch would leave it PENDING_VALIDATION.
#
name = "dns_check"
image = "{{.nuon.components.action_dns_check.outputs.image.ref}}"
timeout = "5m"
enable_kube_config = false
dependencies = ["action_dns_check"]

[[triggers]]
type = "manual"

[[triggers]]
type = "pre-deploy-component"
component_name = "certificate"

[[steps]]
name = "resolve-public-zone"
inline_contents = "./dns_check/dns_check.sh"

[steps.env_vars]
DOMAIN = "{{.nuon.install.sandbox.outputs.nuon_dns.public_domain.name}}"
APP_HOST = "app.{{.nuon.install.sandbox.outputs.nuon_dns.public_domain.name}}"
EXPECTED_NS = "{{ range $ns := .nuon.install.sandbox.outputs.nuon_dns.public_domain.nameservers }}{{ $ns }} {{ end }}"
RESOLVER = "1.1.1.1"
ATTEMPTS = "10"
SLEEP_SECONDS = "15"

[labels]
runtime = "container"
sample = "dns-gate"
