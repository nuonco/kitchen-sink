# branch
# Never runs automatically; an operator selects and submits a commit.
name = "manual-release"

ignore_changes_regex    = "^(kitchen-sink-gcp/|kitchen-sink-aws-byo-vpc/)"
send_statuses_on_ignore = true

[public_repo]
repo      = "nuonco/kitchen-sink"
directory = "kitchen-sink-aws"
branch    = "main"

[run]
mode = "manual_only"

[[install_groups]]
name  = "manual"
order = 1

[install_groups.label_selector]
mode = "manual_only"

[[install_groups]]
name    = "default"
order   = 2
default = true
