# branch
# this branch is only executed when a PR is opened against the base branch with the label of `update-app-branch`
name = "github-label-release"

ignore_changes_regex    = "^(kitchen-sink-gcp/|kitchen-sink-aws-byo-vpc/)"
send_statuses_on_ignore = true

# Label matching requires the GitHub App connection so Nuon can query PR data.
[connected_repo]
repo      = "nuonco/kitchen-sink"
directory = "kitchen-sink-aws"
branch    = "main"

[run]
mode         = "on_github_label"
github_label = "update-app-branch"

[[install_groups]]
name  = "github-label"
order = 1

[install_groups.label_selector]
mode = "on_github_label"

[[install_groups]]
name    = "default"
order   = 2
default = true
