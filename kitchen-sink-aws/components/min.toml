# helm
# Minimal ConfigMap from nuonco/charts (charts/min). Fixture for the component
# differ: the chart source lives in an external repo, so a change there is a
# different diff from a change to the values below.
name           = "min"
type           = "helm_chart"
chart_name     = "min"
namespace      = "kitchen-sink"
storage_driver = "configmap"
# The kitchen_sink chart owns the kitchen-sink namespace. Deploying first
# would have Helm create it unowned and the chart's install would then fail.
dependencies   = ["kitchen_sink"]

[public_repo]
repo      = "nuonco/charts"
directory = "charts/min"
branch    = "main"

[values]
message = "hello"
owner   = "{{.nuon.install.id}}"

# External-repo differ fixture, not part of the product path. Opt out so it
# does not drag the install-level health rollup.
[health]
enabled = false
