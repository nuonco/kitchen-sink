# Runbook invoked by the "component-health" trigger rule (see triggers.toml).
# It re-reports a custom component health check via the Nuon API using the
# values mapped from the incoming trigger event payload, making the runbook the
# single writer of health status while any number of event sources (the
# healthcheck CLI extension, a Datadog monitor, CI, ...) feed it via the trigger.
name        = "report-health"
description = "Report a component custom health check from a trigger event"

[[input]]
name         = "install"
display_name = "Install ID"
description  = "Install to report health for (comes from the event payload, since a trigger rule cannot route to it dynamically)"
required     = true
type         = "string"

[[input]]
name         = "component"
display_name = "Component ID"
description  = "Component to report health for"
required     = true
type         = "string"

[[input]]
name         = "check"
display_name = "Check name"
description  = "Custom health check name"
required     = true
type         = "string"

[[input]]
name         = "status"
display_name = "Status"
description  = "healthy | degraded | unhealthy | unknown"
required     = true
type         = "string"

[[input]]
name         = "message"
display_name = "Message"
description  = "Human-readable message"
required     = false
type         = "string"
default      = ""

[[input]]
name         = "details"
display_name = "Details JSON"
description  = "Details object as a JSON string"
required     = false
type         = "string"
default      = ""

[[steps]]
name            = "report-health-check"
type            = "action"
timeout         = "1m"
inline_contents = "./runbooks/report-health/script.sh"
