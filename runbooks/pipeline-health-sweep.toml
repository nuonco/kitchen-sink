name        = "pipeline-health-sweep"
description = "Check an install end to end: nodes, the Conduit workloads, the ALB ingress, the public HTTPS endpoint, and whether syncs are actually landing."
readme      = "./runbooks/pipeline-health-sweep.md"

[labels]
team = "platform"
kind = "health-check"

[[steps]]
name    = "node-health"
type    = "action"
timeout = "2m"
inline_contents = """
#!/usr/bin/env sh
set -uo pipefail

echo "=== Nodes ==="
kubectl get nodes -o wide 2>&1 || true
echo "=== Node capacity ==="
kubectl top nodes 2>&1 || true
"""

[[steps]]
name        = "workload-health"
type        = "action"
action_name = "sync_heartbeat"

[[steps]]
name    = "rollout-convergence"
type    = "action"
timeout = "6m"
inline_contents = """
#!/usr/bin/env sh
set -uo pipefail

for deploy in conduit-api conduit-ui conduit-worker conduit-postgres; do
  echo "=== rollout status: $deploy ==="
  kubectl rollout status "deploy/$deploy" -n conduit --timeout=90s 2>&1 || true
done

echo "=== Horizontal pod autoscalers ==="
kubectl get hpa -n conduit 2>&1 || true
"""

[[steps]]
name    = "ingress-health"
type    = "action"
timeout = "3m"
inline_contents = """
#!/usr/bin/env sh
set -uo pipefail

echo "=== Helm releases in conduit ==="
helm list -n conduit 2>&1 || true
echo "=== ALB ingress (address, target group state, controller events) ==="
kubectl describe ingress conduit-alb -n conduit 2>&1 || true
"""

[[steps]]
name    = "endpoint-health"
type    = "action"
timeout = "5m"
command = 'curl --fail --show-error --silent --retry $MAX_RETRIES --retry-delay 15 https://app.{{ .nuon.install.sandbox.outputs.nuon_dns.public_domain.name }}/livez'

[steps.env_vars]
MAX_RETRIES = "10"

# The layers above can all be green while syncs quietly stop. This reads the
# engine's own status API through the public endpoint — the same data the
# app's Pipelines page shows.
[[steps]]
name    = "sync-freshness"
type    = "action"
timeout = "2m"
command = 'curl --fail --show-error --silent https://app.{{ .nuon.install.sandbox.outputs.nuon_dns.public_domain.name }}/api/sync/pipelines'
