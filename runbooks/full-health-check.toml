name        = "full-health-check"
description = "Checks nodes, workloads, ingress, and the public endpoint."
readme      = "./runbooks/full-health-check.md"

[labels]
kind = "health-check"
team = "platform"

[[steps]]
name        = "node-health"
type        = "action"
action_name = "health_nodes"

[[steps]]
name        = "workload-health"
type        = "action"
action_name = "cron_status"

[[steps]]
name        = "rollout-convergence"
type        = "action"
action_name = "health_rollout"

[[steps]]
name        = "ingress-health"
type        = "action"
action_name = "health_ingress"

[[steps]]
name        = "endpoint-health"
type        = "action"
action_name = "health_endpoint"
