name        = "full-health-check"
description = "Delivery health sweep: check an install end to end — nodes, the Relay workloads, the ALB ingress, and the public HTTPS endpoint."
readme      = "./runbooks/full-health-check.md"

[labels]
team = "platform"
kind = "health-check"

[[steps]]
name    = "node-health"
type    = "action"
timeout = "2m"
inline_contents = """
#!/usr/bin/env sh
set -uo pipefail

echo "=== Nodes ==="
kubectl get nodes -o wide 2>&1 || true
echo "=== Node capacity ==="
kubectl top nodes 2>&1 || true
"""

[[steps]]
name        = "workload-health"
type        = "action"
action_name = "cron_status"

[[steps]]
name    = "rollout-convergence"
type    = "action"
timeout = "6m"
inline_contents = """
#!/usr/bin/env sh
set -uo pipefail

for deploy in relay-api relay-ui relay-worker; do
  echo "=== rollout status: $deploy ==="
  kubectl rollout status "deploy/$deploy" -n relay --timeout=90s 2>&1 || true
done

echo "=== Horizontal pod autoscalers ==="
kubectl get hpa -n relay 2>&1 || true
"""

[[steps]]
name    = "ingress-health"
type    = "action"
timeout = "3m"
inline_contents = """
#!/usr/bin/env sh
set -uo pipefail

echo "=== Helm releases in relay ==="
helm list -n relay 2>&1 || true
echo "=== ALB ingress (address, target group state, controller events) ==="
kubectl describe ingress relay-alb -n relay 2>&1 || true
"""

[[steps]]
name    = "endpoint-health"
type    = "action"
timeout = "5m"
command = 'curl --fail --show-error --silent --retry $MAX_RETRIES --retry-delay 15 https://app.{{ .nuon.install.sandbox.outputs.nuon_dns.public_domain.name }}/livez'

[steps.env_vars]
MAX_RETRIES = "10"
