# Marker Service for the toggleable audit_log_exporter component. The console
# checks the relay namespace for a Service with this name and unlocks the
# delivery-log export view when it exists. It selects the console pods (the
# demo has no real exporter workload; the entitlement mechanic is the product
# being shown) so the Service has real endpoints.
apiVersion: v1
kind: Service
metadata:
  name: relay-audit-log-exporter
  labels:
    app.kubernetes.io/name: relay-audit-log-exporter
    app.kubernetes.io/part-of: relay
    nuon.co/purpose: feature-flag-marker
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: relay-ui
    app.kubernetes.io/component: ui
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: relay
