# Marker Service for the toggleable compliance_export component. The UI
# checks the conduit namespace for a Service with this name and unlocks the
# entitlement view when it exists. It selects the UI pods (the entitlement
# mechanic is the product being shown) so the Service has real endpoints.
apiVersion: v1
kind: Service
metadata:
  name: conduit-compliance-export
  labels:
    app.kubernetes.io/name: conduit-compliance-export
    app.kubernetes.io/part-of: conduit
    nuon.co/purpose: feature-flag-marker
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: conduit-ui
    app.kubernetes.io/component: ui
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: conduit
