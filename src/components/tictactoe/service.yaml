# Marker Service for the toggleable tictactoe component. The console checks
# the relay namespace for a Service with this name and unlocks the game when
# it exists. It selects the console pods (the game is client-side, served by
# the UI image already running) so the Service has real endpoints.
apiVersion: v1
kind: Service
metadata:
  name: relay-tictactoe
  labels:
    app.kubernetes.io/name: relay-tictactoe
    app.kubernetes.io/part-of: relay
    nuon.co/purpose: feature-flag-marker
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: relay-ui
    app.kubernetes.io/component: ui
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: relay
