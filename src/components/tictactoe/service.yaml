# Marker Service for the toggleable tictactoe component. The console checks
# the periscope namespace for a Service with this name and unlocks the game
# when it exists. It selects the web UI pods (the game is client-side, served
# by the web image already running) so the Service has real endpoints.
apiVersion: v1
kind: Service
metadata:
  name: periscope-tictactoe
  labels:
    app.kubernetes.io/name: periscope-tictactoe
    app.kubernetes.io/part-of: periscope
    nuon.co/purpose: feature-flag-marker
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: periscope-web
    app.kubernetes.io/component: web
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: periscope
