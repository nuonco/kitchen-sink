# One Job that runs at deploy time, so the observed namespace shows a
# scheduled pod and a completion the moment an install finishes deploying —
# the CronJob's first tick is otherwise up to five minutes out. Same pod spec
# as the CronJob's job template. TTL removes it after a day; a later redeploy
# of the component recreates (and re-runs) it.
#
# A Job's pod template is immutable: if you change the spec below, rename the
# Job too, or re-applying over a live one fails.
apiVersion: batch/v1
kind: Job
metadata:
  name: activity-seed
  labels:
    app.kubernetes.io/name: activity-generator
    app.kubernetes.io/part-of: periscope
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: activity-generator
        app.kubernetes.io/part-of: periscope
    spec:
      restartPolicy: Never
      containers:
        - name: task
          image: public.ecr.aws/docker/library/busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "activity job on $(hostname), $(date -u)"
              i=1
              while [ "$i" -le 5 ]; do
                echo "step $i of 5"
                sleep 4
                i=$((i + 1))
              done
              echo "done"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
