name: Build and publish action-db-tools image

on:
  push:
    tags:
      - "action-db-tools/v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver image tag (for example, 1.0.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  AWS_REGION: us-west-2
  ROLE_ARN: ${{ vars.PRIVATE_ECR_ROLE_ARN }}
  IMAGE: 949309607565.dkr.ecr.us-west-2.amazonaws.com/kitchen-sink-components

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${DISPATCH_VERSION}"
          else
            VERSION="${GITHUB_REF_NAME#action-db-tools/v}"
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "expected a semver version, got ${VERSION}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ./components/action-db-tools
          file: ./components/action-db-tools/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: |
          cosign sign --yes \
            "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: action-db-tools.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate action-db-tools.spdx.json \
            "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
