# Maintenance role - used for ongoing operations
[maintenance_role]
name         = "{{.nuon.install.id}}-maintenance"
description  = "Role for maintenance operations on install {{.nuon.install.id}}"
display_name = "Kitchen Sink Maintenance"

[[maintenance_role.policies]]
managed_policy_name = "AdministratorAccess"

[[maintenance_role.policies]]
name = "deny-secrets-manager"
contents = """
{
    "Version": "2012-10-17",
    "Statement": [
        {
            "Sid": "DenySecretsManagerAccess",
            "Effect": "Deny",
            "Action": [
                "secretsmanager:*"
            ],
            "Resource": "*"
        }
    ]
}
"""

# Provision role - used when provisioning new installs
[provision_role]
name         = "{{.nuon.install.id}}-provision"
description  = "Role for provisioning install {{.nuon.install.id}}"
display_name = "Kitchen Sink Provision"

