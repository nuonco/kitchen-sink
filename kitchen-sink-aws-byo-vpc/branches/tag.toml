# branch
# this branch is updated when a git tag is pushed with the provided prefix
name = "tag-release"

ignore_changes_regex    = "^(kitchen-sink-gcp/|kitchen-sink-aws/)"
send_statuses_on_ignore = true

[public_repo]
repo      = "nuonco/kitchen-sink"
directory = "kitchen-sink-aws-byo-vpc"
branch    = "main"

[run]
mode = "on_tag"
tag_prefix = "app-branch-release/"

[[install_groups]]
name  = "tag"
order = 1

[install_groups.label_selector]
mode = "on_tag_prefix"

[[install_groups]]
name    = "default"
order   = 2
default = true
