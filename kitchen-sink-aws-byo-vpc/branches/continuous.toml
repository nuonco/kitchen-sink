# branch
# this is the preview and push branch that is updated on every push to the repo.
name = "continuous-release"

ignore_changes_regex    = "^(kitchen-sink-gcp/|kitchen-sink-aws/)"
send_statuses_on_ignore = true

[public_repo]
repo      = "nuonco/kitchen-sink"
directory = "kitchen-sink-aws-byo-vpc"
branch    = "main"

[run]
mode = "push"

[preview]
mode = "plan-only"
set_statuses = true
comment = true
ignore_drafts = true
react = true

[preview.label_selector]
env = "preview"

[[install_groups]]
name  = "preview"
order = 1

[install_groups.label_selector]
env = "preview"

[[install_groups]]
name  = "push"
order = 2

[install_groups.label_selector]
mode = "push"

[[install_groups]]
name    = "default"
order   = 3
default = true
