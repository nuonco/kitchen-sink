# input
# Read by the chart (components/chart/values.yaml, telemetry.demoProfile) as
# the worker's DEMO_PROFILE. Flip one install to "incident" and only that
# install's error rate, latency and backlog climb in the vendor's backend.
name         = "telemetry_demo_profile"
display_name = "Telemetry Demo Profile"
description  = "Synthetic workload the worker emits: steady, noisy, or incident (reconcile_billing jobs degrade)"
group        = "telemetry"
type         = "string"
default      = "steady"
internal     = true
