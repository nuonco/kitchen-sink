# The second toggleable component: where tictactoe is the fun surprise, this
# one carries the commercial framing — a compliance-export destination sold as
# an entitlement ("included in the Enterprise plan"), enabled per install. Off
# by default, so a plain install shows the locked tile; toggling it on for one
# install deploys the marker Service below, which the UI detects live.
# Toggle rules cut both ways: nothing always-enabled may depend on this
# component or reference its outputs.
name = "compliance_export"
type = "kubernetes_manifest"

namespace    = "conduit"
dependencies = ["conduit"]

toggleable      = true
default_enabled = false

[public_repo]
directory = "."
repo      = "nuonco/kitchen-sink"
# Ships with the Conduit theme; flip back to "main" when ms/theme-conduit
# merges.
branch = "ms/theme-conduit"

[kustomize]
path        = "./src/components/compliance-export"
patches     = []
enable_helm = false

[labels]
toggleable = "true"
