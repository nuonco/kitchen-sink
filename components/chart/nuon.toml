# helm
name = "kitchen_sink"
type = "helm_chart"
chart_name = "kitchen-sink"
namespace = "kitchen-sink"
storage_driver = "configmap"
dependencies = ["img_api", "img_ui"]

[public_repo]
repo = "nuonco/kitchen-sink"
directory = "components/chart"
# Chart edits for the onboarding restyle live on this branch; flip back to
# "main" when ms/onboarding-edit merges.
branch = "ms/onboarding-edit"

[[values_file]]
# Path resolves relative to the `components/` directory. This is the chart's
# own values.yaml — Nuon interpolates it (img_api/img_ui outputs, sandbox DNS)
# and layers it over the chart defaults, so there's a single values file.
contents = "./chart/values.yaml"

[[operation_roles]]
operation = "deploy"
role = "setup"

[[operation_roles]]
operation = "teardown"
role = "maintenance"

[labels]
helm = "true"

# Live health, independent of deploy status. Deployments, pods, services,
# ingresses and the Helm release itself are assessed automatically; this block
# only tunes that and adds probes.
#
# `block_deploy` is off, so the deploy step records what health did without
# gating on it. Flip it to `true` once the probes below are confirmed green on a
# real install and every kitchen_sink deploy grows a `verify health` step that
# fails if the chart does not hold healthy for the stabilization window.
[health]
enabled              = true
stabilization_window = "3m"
block_deploy         = false

# Probes assert the app is serving, above the level of "the pod is Ready".
# Each targets an in-cluster service this chart itself creates, per the guide's
# rule that a component's probes must assert what that component provides — the
# public endpoint is probed on application_load_balancer instead.
[[health.probes]]
type = "http"
url  = "http://kitchen-sink-api.kitchen-sink.svc.cluster.local:8080/readyz"

[[health.probes]]
type = "http"
url  = "http://kitchen-sink-ui.kitchen-sink.svc.cluster.local:3000/livez"

# The worker serves its health port but is not fronted by an HTTP route, so
# assert the port accepts connections.
[[health.probes]]
type = "tcp"
url  = "kitchen-sink-worker.kitchen-sink.svc.cluster.local:8090"
