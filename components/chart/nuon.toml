# helm
name           = "kitchen_sink"
type           = "helm_chart"
chart_name     = "kitchen-sink"
namespace      = "kitchen-sink"
storage_driver = "configmap"
dependencies   = ["img_api", "img_ui"]

[connected_repo]
repo      = "nuonco/kitchen-sink"
directory = "components/chart"
branch    = "main"

[[values_file]]
contents = "./values/kitchen-sink.yaml"

[[operation_roles]]
operation = "deploy"
role      = "setup"

[[operation_roles]]
operation = "teardown"
role      = "maintenance"

[health]
enabled              = true
stabilization_window = "5m"
block_deploy         = true

# API — readiness (dependencies wired up) via in-cluster service DNS
[[health.probes]]
type = "http"
name = "api-readyz"
url  = "http://kitchen-sink-api.kitchen-sink.svc.cluster.local:8080/readyz"

# API — liveness (process up)
[[health.probes]]
type = "http"
name = "api-livez"
url  = "http://kitchen-sink-api.kitchen-sink.svc.cluster.local:8080/livez"

# API — raw TCP reachability of the service port
[[health.probes]]
type = "tcp"
name = "api-tcp"
url  = "kitchen-sink-api.kitchen-sink.svc.cluster.local:8080"

# UI — readiness via in-cluster service DNS
[[health.probes]]
type = "http"
name = "ui-readyz"
url  = "http://kitchen-sink-ui.kitchen-sink.svc.cluster.local:3000/readyz"

# UI — full public path (ingress + DNS + TLS end-to-end)
[[health.probes]]
type = "http"
name = "ui-public"
url  = "https://app.{{.nuon.install.sandbox.outputs.nuon_dns.public_domain.name}}/livez"

# Worker — liveness via its health service (added alongside this change)
[[health.probes]]
type = "http"
name = "worker-livez"
url  = "http://kitchen-sink-worker.kitchen-sink.svc.cluster.local:8090/livez"

[labels]
helm = "true"
