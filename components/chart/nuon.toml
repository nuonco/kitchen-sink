# helm
name = "kitchen_sink"
type = "helm_chart"
chart_name = "kitchen-sink"
namespace = "kitchen-sink"
storage_driver = "configmap"
dependencies = ["img_api", "img_ui"]

[connected_repo]
repo = "nuonco/kitchen-sink"
directory = "components/chart"
branch = "main"

[[values_file]]
# Path resolves relative to the `components/` directory. This is the chart's
# own values.yaml — Nuon interpolates it (img_api/img_ui outputs, sandbox DNS)
# and layers it over the chart defaults, so there's a single values file.
contents = "./chart/values.yaml"

[[operation_roles]]
operation = "deploy"
role = "setup"

[[operation_roles]]
operation = "teardown"
role = "maintenance"

# Block deploys on a custom health check pushed via the CLI extension
# (nuon-ext-healthcheck). The deploy waits for the "datadog-metric" check to
# report healthy within the stabilization window; if it stays unhealthy (or is
# never reported), block_deploy fails the deploy. required_checks must match the
# --check name the reporter pushes.
[health]
block_deploy = true
stabilization_window = "3m"
required_checks = ["custom-healthcheck"]

[labels]
helm = "true"
# Bump to force a component-config change so a branch run redeploys this
# component (the config diff keys off the component checksum, which does not
# fold in values.yaml/chart-file contents). Increment to trigger a deploy.
demo_rev = "1785961476"
