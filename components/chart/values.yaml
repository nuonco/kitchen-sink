namespace: relay
serviceAccount: relay

api:
  image: "{{.nuon.components.img_api.outputs.image.repository}}:{{.nuon.components.img_api.outputs.image.tag}}"
  port: 8080
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 50
    targetMemoryUtilizationPercentage: 50
  # No internal ingress: the UI reaches the API via the in-cluster service
  # (see ui.env.API_URL). An internal ingress here never converges (no cert/DNS
  # for its host), which would keep the component health from ever going green.
  ingress: {}

ui:
  image: "{{.nuon.components.img_ui.outputs.image.repository}}:{{.nuon.components.img_ui.outputs.image.tag}}"
  port: 3000
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 50
    targetMemoryUtilizationPercentage: 50
  # Disabled: the sandbox's ingress-nginx sits behind an internal-scheme NLB
  # (the AWS Load Balancer Controller default), so a host published through it
  # is unreachable from the internet. Public HTTPS access comes from the
  # application_load_balancer component instead.
  ingress:
    enabled: false
    publicHost: "app.{{.nuon.install.sandbox.outputs.nuon_dns.public_domain.name}}"
  env:
    API_URL: "http://relay-api:8080"
    # The namespace the console inspects (its /api proxy allowlist is built
    # from this). Matches `namespace` above.
    NUON_NAMESPACE: "relay"
    # Runtime config for the UI, served back to the browser at /api/ui-config.
    # These are the only way the frontend can know which install it is running
    # in, which is what its deep links into the Nuon dashboard are built from.
    # Any value that does not resolve is dropped by the server, so the UI simply
    # hides the fact or the link rather than showing a broken one.
    NUON_INSTALL_ID: "{{.nuon.install.id}}"
    NUON_ORG_ID: "{{.nuon.org.id}}"
    NUON_APP_ID: "{{.nuon.app.id}}"
    NUON_REGION: "{{.nuon.install_stack.outputs.region}}"
    NUON_PUBLIC_DOMAIN: "{{.nuon.install.sandbox.outputs.nuon_dns.public_domain.name}}"
    # Mirrors cluster_name in sandbox.toml.
    NUON_CLUSTER_NAME: "n-{{.nuon.install.id}}"
    # The audit_log_exporter component's id, so the ops page can deep-link to
    # that component's page on this install (where its toggle lives). This
    # reads `.component_id`, deliberately NOT `.outputs.`: Nuon only derives a
    # component dependency (and cascades toggleable disablement) from
    # `.outputs.` references, and nothing always-enabled may depend on this
    # toggleable component. Resolves whether the component is toggled on or
    # off; if it does not resolve, the server drops it and the ops page falls
    # back to the install's components list.
    NUON_AUDIT_LOG_EXPORTER_COMPONENT_ID: "{{.nuon.components.audit_log_exporter.component_id}}"

worker:
  image: "{{.nuon.components.img_api.outputs.image.repository}}:{{.nuon.components.img_api.outputs.image.tag}}"
  port: 8090
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Pinned to a single replica: the queue is claim-safe (FOR UPDATE SKIP
  # LOCKED), but one worker keeps the demo's delivery timeline trivially
  # readable — one attempt, one log line, no interleaving.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 50
    targetMemoryUtilizationPercentage: 50

# The delivery store: an in-chart Postgres 16 behind Service relay-db:5432.
# Its password is the Nuon-synced db-password Secret (secrets.toml) — the same
# secretKeyRef the api and worker consume. Storage is an emptyDir ON PURPOSE:
# a database pod restart wipes the rows, and that is acceptable here BECAUSE
# the api/worker run idempotent embedded migrations + seed data on every
# start, so the store rebuilds itself into a working, populated state within
# seconds. A durable install would swap the emptyDir for a PVC or RDS; the
# delivery mechanics would not change.
db:
  image: "postgres:16-alpine"
  port: 5432
  database: relay
  user: relay
  passwordSecret:
    name: db-password
    # The synced Secret keys the value by the Nuon secret's name.
    key: db_password
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# The echo receiver: Relay's pre-registered default destination (seeded as
# endpoint ep_echo_default -> http://relay-echo:8081/webhook). Same image and
# binary as the api, running in RELAY_MODE=echo — every delivery to it is a
# real HTTP round-trip inside the cluster.
echo:
  image: "{{.nuon.components.img_api.outputs.image.repository}}:{{.nuon.components.img_api.outputs.image.tag}}"
  port: 8081
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Demo traffic: a CronJob that POSTs 1-3 generated events to /ingest every
# two minutes (RELAY_MODE=generate, one-shot). The events are synthetic and
# say so in their payload (source: relay-event-generator); the deliveries
# they trigger are real.
generator:
  image: "{{.nuon.components.img_api.outputs.image.repository}}:{{.nuon.components.img_api.outputs.image.tag}}"
  schedule: "*/2 * * * *"
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

probes:
  liveness: /livez
  readiness: /readyz
