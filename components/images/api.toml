# container-image
# Pre-built image from Nuon's public ECR gallery, containing BOTH /bin/api and
# /bin/worker (the api and worker deployments run different entrypoints out of
# this one image). Source lives in components/api; pushes touching it are built
# and published by .github/workflows/build-images.yaml, which then stamps the
# tag below — that stamp commit is what starts the staged rollout.
#
# img_api_two stays as the app's private-ECR (cross-account IAM role) example.
name     = "img_api"
type     = "container_image"
var_name = "img_api"

max_auto_retries = 5

[public]
image_url = "public.ecr.aws/p7e3r5y0/kitchen-sink-app"
tag       = "sha-e181095"

[labels]
is_image = "true"
