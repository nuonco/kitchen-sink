# container-image
# Pre-built image from Nuon's public ECR gallery, containing BOTH /bin/api
# (the Relay ingest API) and /bin/worker (the delivery engine) — the two
# deployments run different entrypoints out of this one image. Source lives in
# components/api; pushes touching it are built and published by
# .github/workflows/build-images.yaml, which then stamps the tag below — that
# stamp commit is what starts the staged rollout. The ECR repo name is
# AWS-side and predates the Relay retheme.
#
# img_api_two stays as the app's private-ECR (cross-account IAM role) example.
name     = "img_api"
type     = "container_image"
var_name = "img_api"

max_auto_retries = 5

[public]
image_url = "public.ecr.aws/p7e3r5y0/kitchen-sink-app"
tag       = "sha-017426c"

[labels]
is_image = "true"
