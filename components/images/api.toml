# container-image
# Pre-built image from Nuon's ECR, containing BOTH /bin/api and /bin/worker
# (the api and worker deployments run different entrypoints out of this one
# image). The source lives in components/api in this repo; docker_build
# components are deprecated (the control plane rejects them on sync), so
# shipping an API change means building and pushing a new image and stamping
# the tag here — `scripts/build-and-push.sh` does all three.
#
# img_api_two stays as the untouched private-ECR example.
name     = "img_api"
type     = "container_image"
var_name = "img_api"

[aws_ecr]
image_url    = "431927561584.dkr.ecr.us-west-2.amazonaws.com/kitchen-sink-app"
tag          = "2ab4b6587ee5-wip20260804004838"
region       = "us-west-2"
iam_role_arn = "arn:aws:iam::431927561584:role/nuon-ecr-access"

[labels]
is_image = "true"
