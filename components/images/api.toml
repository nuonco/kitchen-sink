# docker-build
# The API is built from this repo rather than pulled from Nuon's ECR, so an edit
# under components/api ships on the next deploy. Outputs are the same shape a
# container_image component emits, which is what keeps
# {{.nuon.components.img_api.outputs.image.repository}} resolving in the chart's
# values file -- for the api deployment and the worker deployment, which run
# /bin/api and /bin/worker out of this one image.
#
# img_api_two is still a container_image on purpose: it stays as the app's
# private-ECR example.
name     = "img_api"
type     = "docker_build"
var_name = "img_api"

dockerfile = "Dockerfile"
# The dependency tree here is large (client-go plus Helm) and the Dockerfile
# wipes the module cache on purpose, so give the build room.
build_timeout = "45m"

[public_repo]
repo      = "nuonco/kitchen-sink"
directory = "components/api"
# Match components/chart/nuon.toml: flip back to "main" when
# ms/onboarding-edit merges.
branch    = "ms/onboarding-edit"

[labels]
is_image = "true"
