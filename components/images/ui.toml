# docker-build
# The UI is built from this repo rather than pulled from Nuon's ECR, so an edit
# under components/ui ships on the next deploy. Outputs are the same shape a
# container_image component emits, which is what keeps
# {{.nuon.components.img_ui.outputs.image.repository}} resolving in the chart's
# values file.
name     = "img_ui"
type     = "docker_build"
var_name = "img_ui"

dockerfile    = "Dockerfile"
build_timeout = "30m"

[public_repo]
repo      = "nuonco/kitchen-sink"
directory = "components/ui"
# Match components/chart/nuon.toml: flip back to "main" when
# ms/onboarding-edit merges.
branch    = "ms/onboarding-edit"

[labels]
is_image = "true"
