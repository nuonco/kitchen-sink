# container-image
# Pre-built image from Nuon's public ECR gallery. Source lives in
# components/ui; pushes touching it are built and published by
# .github/workflows/build-images.yaml, which then stamps the tag below — that
# stamp commit is what starts the staged rollout.
name     = "img_ui"
type     = "container_image"
var_name = "img_ui"

max_auto_retries = 5

[public]
image_url = "public.ecr.aws/p7e3r5y0/kitchen-sink-ui"
tag       = "sha-acb07e7"

[labels]
is_image = "true"
