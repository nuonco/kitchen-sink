# The premium ingest image: same binaries, pulled from a private ECR repo via
# a cross-account IAM role — the "customers on the premium plan get the
# private build" story. Repo name is AWS-side and predates the Relay retheme.
name     = "img_api_two"
type     = "container_image"
var_name = "img_api_two"

[aws_ecr]
image_url    = "431927561584.dkr.ecr.us-west-2.amazonaws.com/kitchen-sink-app"
tag          = "latest"
region       = "us-west-2"
iam_role_arn = "arn:aws:iam::431927561584:role/nuon-ecr-access"

[labels]
is_image = "true"
