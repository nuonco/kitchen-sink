# container-image
# Premium connector image: the app's private-ECR example. Nuon pulls it
# cross-account through the IAM role below rather than from a public gallery —
# the shape a paid connector distribution takes. Not referenced by the chart.
name     = "img_premium_connector"
type     = "container_image"
var_name = "img_premium_connector"

[aws_ecr]
image_url    = "431927561584.dkr.ecr.us-west-2.amazonaws.com/kitchen-sink-app"
tag          = "latest"
region       = "us-west-2"
iam_role_arn = "arn:aws:iam::431927561584:role/nuon-ecr-access"

[labels]
is_image = "true"
