# The second toggleable component: where tictactoe is the fun surprise, this
# one carries the commercial framing — Periscope's Enterprise SIEM export,
# sold as an entitlement and enabled per install. Off by default, so a plain
# install shows the locked upsell tile; toggling it on for one install deploys
# the marker Service below, which the console detects live.
# Toggle rules cut both ways: nothing always-enabled may depend on this
# component or reference its outputs.
name = "audit_log_exporter"
type = "kubernetes_manifest"

namespace    = "periscope"
dependencies = ["periscope"]

toggleable      = true
default_enabled = false

[public_repo]
directory = "."
repo      = "nuonco/kitchen-sink"
# Ships with the Periscope theme; flip back to "main" when
# ms/theme-periscope merges.
branch = "ms/theme-periscope"

[kustomize]
path        = "./src/components/audit-log-exporter"
patches     = []
enable_helm = false

[labels]
toggleable = "true"
