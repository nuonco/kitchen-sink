# The second toggleable component: where tictactoe is the fun surprise, this
# one carries the commercial framing — an audit-log exporter sold as an
# entitlement ("included in the Enterprise plan"), enabled per install. Off by
# default, so a plain install shows the locked upsell tile; toggling it on for
# one install deploys the marker Service below, which the UI detects live.
# Toggle rules cut both ways: nothing always-enabled may depend on this
# component or reference its outputs.
name = "audit_log_exporter"
type = "kubernetes_manifest"

namespace    = "kitchen-sink"
dependencies = ["kitchen_sink"]

toggleable      = true
default_enabled = false

[public_repo]
directory = "."
repo      = "nuonco/kitchen-sink"
branch = "main"

[kustomize]
path        = "./src/components/audit-log-exporter"
patches     = []
enable_helm = false

[labels]
toggleable = "true"
