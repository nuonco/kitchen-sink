name = "terraform_tags"
type = "terraform_module"
terraform_version = "1.9.0"
drift_schedule = "0 0 * * *"
dependencies = ["pulumi_infra"]

[connected_repo]
repo = "nuonco/kitchen-sink"
directory = "components/terraform"
branch = "ja/healthcheck-demo-fixes"

# WORKAROUND (temporary): no [vars] / [[var_file]] here on purpose. Nuon's
# component terraform pipeline re-passes -var-file on the apply-plan step against
# the saved plan, which Terraform rejects ("Can't set variables when applying a
# saved plan") — fix in flight: nuonco/nuon#2080. Any [vars]/[[var_file]] entry
# repopulates that -var-file and breaks the deploy. Instead the module derives
# its inputs from AWS data sources and the injected NUON_INSTALL_ID env var (see
# main.tf). Restore a plain [vars] block once the runner fix ships.
#
# NUON_INSTALL_ID is a plain env var (not a reserved TF_* name and not a
# -var-file), so it's allowed and doesn't affect the saved plan.
[env_vars]
NUON_INSTALL_ID = "{{.nuon.install.id}}"

[labels]
custom_component_type = "terraform"
