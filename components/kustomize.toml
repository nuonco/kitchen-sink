name = "kustomizeapp"
type = "kubernetes_manifest"

namespace    = "{{.nuon.install.id}}-dne"
dependencies = ["kustomize_namespace"]

[public_repo]
directory = "."
repo      = "argoproj/argocd-example-apps"
branch    = "master"

[kustomize]
path        = "./kustomize-guestbook"
patches     = []
enable_helm = false

[labels]
custom_component_type = "kustomize"

# Kubernetes manifest components are health-checked automatically. This one is an
# upstream example (argoproj/argocd-example-apps) kept as a kustomize test
# fixture, not part of the product path, so it is opted out — otherwise a fixture
# flapping drags the install-level health rollup down with it.
[health]
enabled = false
