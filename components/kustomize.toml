# The sample customer workload the Periscope console observes: an upstream
# kustomize app applied straight from a public repo into its own namespace, so
# the console's live views always have a workload that is not the console
# itself.
name = "observed_workload"
type = "kubernetes_manifest"

namespace    = "{{.nuon.install.id}}-observed"
dependencies = ["observed_namespace"]

[public_repo]
directory = "."
repo      = "argoproj/argocd-example-apps"
branch    = "master"

[kustomize]
path        = "./kustomize-guestbook"
patches     = []
enable_helm = false

[labels]
custom_component_type = "kustomize"

# Kubernetes manifest components are health-checked automatically. This one is
# an upstream example (argoproj/argocd-example-apps) that plays the observed
# workload, not part of the product path, so it is opted out — otherwise the
# sample flapping drags the install-level health rollup down with it.
[health]
enabled = false
