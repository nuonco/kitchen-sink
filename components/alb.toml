# helm
# Internet-facing application load balancer for the UI. The sandbox's
# ingress-nginx sits behind an internal-scheme NLB, so this ALB (plus the ACM
# cert from the certificate component) is what makes the app reachable at
# https://app.<install domain>.
name         = "application_load_balancer"
type         = "helm_chart"
chart_name   = "application-load-balancer"
dependencies = ["kitchen_sink", "certificate"]

[public_repo]
repo      = "nuonco/example-app-configs"
directory = "eks-simple/src/components/alb"
branch    = "main"

[values]
domain_certificate = "{{.nuon.components.certificate.outputs.public_domain_certificate_arn}}"
domain             = "app.{{.nuon.install.sandbox.outputs.nuon_dns.public_domain.name}}"
https_port         = "443"
service_name       = "kitchen-sink-ui"
service_port       = "3000"
install_name       = "{{.nuon.install.id}}"
namespace          = "kitchen-sink"
healthcheck_path   = "/livez"

[labels]
helm = "true"
