# pulumi
# S3 bucket for archived delivery logs (versioned, encrypted, public access
# blocked).
name    = "pulumi_infra"
type    = "pulumi"
runtime = "go"

[public_repo]
repo      = "nuonco/kitchen-sink"
directory = "components/pulumi"
# The relay config-key/bucket rename lives on this branch; flip back to
# "main" when ms/theme-relay merges.
branch    = "ms/theme-relay"

[config]
"aws:region"        = "{{.nuon.install_stack.outputs.region}}"
"relay:install_id"  = "{{.nuon.install.id}}"

[env_vars]
PULUMI_SKIP_UPDATE_CHECK = "true"

[labels]
custom_component_type = "pulumi"
