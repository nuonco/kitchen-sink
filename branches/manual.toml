# branch
# Never runs automatically; an operator selects and submits a commit.
name = "manual-release"

[public_repo]
repo      = "nuonco/kitchen-sink"
directory = "."
branch    = "main"

[run]
mode = "manual_only"

[[install_groups]]
name  = "manual"
order = 1

[install_groups.label_selector]
mode = "manual_only"
