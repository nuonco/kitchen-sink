# Runs when a release/v* tag points at a commit reachable from jm/change-tests.
name = "tagged-release"
post_deploy_runbooks = ["full-health-check"]

[public_repo]
repo      = "nuonco/kitchen-sink"
directory = "."
branch    = "jm/change-tests"

[run]
mode       = "on_tag_prefix"
tag_prefix = "release/"

[[install_groups]]
name  = "customers"
order = 1

[install_groups.label_selector]
env  = "production"
tier = "customer"
