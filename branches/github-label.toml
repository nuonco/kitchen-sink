# Runs when a PR carrying this label is merged into jm/change-tests.
name = "labeled-release"
post_deploy_runbooks = ["full-health-check"]

# Label matching requires the GitHub App connection so Nuon can query PR data.
[connected_repo]
repo      = "nuonco/kitchen-sink"
directory = "."
branch    = "jm/change-tests"

[run]
mode         = "on_github_label"
github_label = "deploy-cadence-daily"

[[install_groups]]
name  = "enterprise"
order = 1

[install_groups.label_selector]
env  = "production"
tier = "enterprise"
