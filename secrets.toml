# Required secret - must be provided by customer
[[secret]]
name         = "api_key_{{.nuon.install.id}}"
display_name = "API Key for {{.nuon.install.id}}"
description  = "API key required for the application"
required     = true

kubernetes_sync             = true
kubernetes_secret_namespace = "{{.nuon.install.id}}"
kubernetes_secret_name      = "api-key"

# Auto-generated secret with K8s sync
[[secret]]
name         = "db_password_{{.nuon.install.id}}"
display_name = "Auto-generated database password"
description  = "Database password (auto-generated)"

auto_generate = true

kubernetes_sync             = true
kubernetes_secret_namespace = "{{.nuon.install.id}}"
kubernetes_secret_name      = "database-password"

# Auto-generated secret (Secrets Manager only, no K8s sync)
[[secret]]
name         = "encryption_key_{{.nuon.install.id}}"
display_name = "Encryption key"
description  = "Auto-generated encryption key stored in Secrets Manager only"

auto_generate = true
