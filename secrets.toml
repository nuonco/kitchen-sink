[[secret]]
name = "db_password"
display_name = "Database Password"
description = "Password for the Conduit source database. Generated per install, synced into the cluster, and consumed by the postgres, api, and worker pods via a secretKeyRef — never a literal in values."
auto_generate = true
kubernetes_sync = true
kubernetes_secret_namespace = "conduit"
kubernetes_secret_name = "db-password"

[[secret]]
name = "api_key"
display_name = "API Key"
description = "Key for external API access"
auto_generate = false
kubernetes_sync = true
kubernetes_secret_namespace = "conduit"
kubernetes_secret_name = "api-key"
