# app branch
# Connects one git branch to this app: a push fetches the config at that commit,
# builds what changed, then rolls it across the install groups below in order,
# pausing for an approval on each group's plan.
#
# `name` is the branch's identity in Nuon and is what `nuon sync --branch` and
# triggers.toml refer to. Named after the git branch it tracks (Matt renamed it
# in the dashboard Aug 17 — a Nuon branch named "main" tracking a different git
# branch confused everyone). Branches upsert by name, so this file must always
# match the dashboard name or a sync resurrects the old one. When
# ms/theme-conduit merges to git main: update `name`, `branch` below, and
# every `app_branch` in triggers.toml together.
name = "ms/theme-conduit"

# Runs on each install after its deploy succeeds, in order. The health sweep is
# read-only, so a fleet rollout leaves a per-install health transcript behind
# without applying anything extra.
post_deploy_runbooks = ["pipeline-health-sweep"]

# Same repo, same form the components use. `[public_repo]` rather than
# `[connected_repo]`: the control plane resolves nuonco/kitchen-sink as a public
# repo, and declaring it as connected fails the sync with "can not use a public
# repo with a connected_repo config".
#
# This costs nothing. Pull request previews depend on the org having the Nuon
# GitHub App connected for the repository's *owner* (nuonco), not on which repo
# block the branch uses — a public_repo branch gets previews just like a
# connected one. See https://docs.nuon.co/concepts/app-branches#pull-request-previews
#
# directory = "." because the app config lives at the repo root.
[public_repo]
repo      = "nuonco/kitchen-sink"
directory = "."
branch    = "ms/theme-conduit"

# Groups match the labels already set in install-configs/*.toml. Selectors are
# preferred over install_names: they re-evaluate on every run, so a new customer
# install joins the right wave the moment it is labelled.
[[install_groups]]
name  = "staging"
order = 1
# Plan-only preview runs plan against staging rather than a customer group.
use_for_previews = true

[install_groups.label_selector]
env = "staging"

[[install_groups]]
name  = "customers"
order = 2

[install_groups.label_selector]
env  = "production"
tier = "customer"

[[install_groups]]
name  = "enterprise"
order = 3

[install_groups.label_selector]
env  = "production"
tier = "enterprise"
