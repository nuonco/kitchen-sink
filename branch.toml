# app branch
#
# This file is how the app ships. It connects one git branch of this repo to
# the app: a push to that branch (or `nuon sync --branch main` from a clone)
# fetches the config at that commit, builds what changed, and rolls it across
# the install groups below in order, holding for a person's approval on each
# group's plan before that group deploys.
#
# `name` is the branch's identity in Nuon. It is what `nuon sync --branch`,
# `nuon apps branches runs --branch-id`, and the trigger rules in
# triggers.toml.example refer to, and it is named after the git branch it
# tracks. Branches upsert by name, so keep `name`, the `branch` below, and every
# `app_branch` in triggers.toml.example in step if the tracked branch changes.
#
# Reference: https://docs.nuon.co/config-ref/branch
name = "main"

# Runbooks to run on each install, in order, after its deploy succeeds. The
# health check is read-only.
post_deploy_runbooks = ["full-health-check"]

# Same repo, same form the components use. `[public_repo]` rather than
# `[connected_repo]`: the control plane resolves nuonco/kitchen-sink as a public
# repo, and declaring it as connected fails the sync with "can not use a public
# repo with a connected_repo config".
#
# This costs nothing. Pull request previews depend on the org having the Nuon
# GitHub App connected for the repository's *owner* (nuonco), not on which repo
# block the branch uses — a public_repo branch gets previews just like a
# connected one. See https://docs.nuon.co/concepts/app-branches#pull-request-previews
#
# directory = "." because the app config lives at the repo root.
[public_repo]
repo      = "nuonco/kitchen-sink"
directory = "."
branch    = "main"

# Groups match the labels set in install-configs/*.toml. Selectors are preferred
# over install_names: they re-evaluate on every run, so a new customer install
# joins the right wave the moment it is labelled. Lower `order` deploys first.
[[install_groups]]
name  = "staging"
order = 1

[install_groups.label_selector]
env = "staging"

[[install_groups]]
name  = "customers"
order = 2

[install_groups.label_selector]
env  = "production"
tier = "customer"

[[install_groups]]
name  = "enterprise"
order = 3

[install_groups.label_selector]
env  = "production"
tier = "enterprise"
