[[secret]]
name                        = "db_password"
display_name                = "Database Password"
description                 = "Password for the kitchen-sink database"
auto_generate               = true
kubernetes_sync             = true
kubernetes_secret_namespace = "kitchen-sink"
kubernetes_secret_name      = "kitchen-sink-secrets"

[[secret]]
name                        = "api_key"
display_name                = "API Key"
description                 = "Key for external API access"
auto_generate               = false
kubernetes_sync             = true
kubernetes_secret_namespace = "kitchen-sink"
kubernetes_secret_name      = "kitchen-sink-secrets"
