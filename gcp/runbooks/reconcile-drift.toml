name        = "reconcile-drift"
description = "Re-apply desired state after out-of-band changes: plan the chart, reprovision the sandbox, then roll the infrastructure and app components forward."
readme      = "./runbooks/reconcile-drift.md"

[labels]
team = "platform"
kind = "drift"

# Plan first so the run records what drifted before anything is applied.
[[steps]]
name           = "drift-plan"
type           = "component_deploy"
component_name = "kitchen_sink"
plan_only      = true

# Infrastructure only — components are redeployed by the later steps in the
# order this app's dependency graph requires.
[[steps]]
name                   = "reconcile-sandbox"
type                   = "sandbox_reprovision"
skip_component_deploys = true

[[steps]]
name           = "reconcile-pulumi-infra"
type           = "component_deploy"
component_name = "pulumi_infra"

[[steps]]
name           = "reconcile-certificate"
type           = "component_deploy"
component_name = "certificate"

[[steps]]
name           = "reconcile-external-dns"
type           = "component_deploy"
component_name = "external_dns"

[[steps]]
name              = "reconcile-app"
type              = "component_deploy"
component_name    = "kitchen_sink"
deploy_dependents = true

[[steps]]
name    = "verify"
type    = "action"
timeout = "8m"
command = 'curl --fail --show-error --silent --retry $MAX_RETRIES --retry-delay 15 https://app.{{ .nuon.install.sandbox.outputs.nuon_dns.public_domain.name }}/livez'

[steps.env_vars]
MAX_RETRIES = "20"
